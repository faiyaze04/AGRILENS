run_id: multicrop1_R1_s42
recipe: R1_last_stage
seed: 42
model: mobilenetv4_conv_small.e2400_r224_in1k (ImageNet-1k, timm)
num_classes: 24
dataset:
  id: AGL-MULTICROP-MD
  version: 1.0.0
  root: D:\OneDrive - Faiyaz Personal\OneDrive\3. Shreyance related Documents\AGRILENS_5.0.0\Model_Trainer_Program\datasets\AGL-MULTICROP-MD\AGL-MULTICROP-MD-1.0.0
cache: D:\OneDrive - Faiyaz Personal\OneDrive\3. Shreyance related Documents\AGRILENS_5.0.0\Model_Trainer_Program\training_cache\AGL-MULTICROP-MD-1.0.0
output_dir: D:\OneDrive - Faiyaz Personal\OneDrive\3. Shreyance related Documents\AGRILENS_5.0.0\Model_Trainer_Program\training_runs\agrilens-multicrop-1.0.0
data:
  train: splits/train.csv
  validation: splits/val.csv (selection and early stopping only)
  never_read:
  - splits/test_known_device.csv
  - splits/test_heldout_device.csv
sampling:
  rule: class uniform -> leaf group uniform -> image uniform
  samples_per_epoch: 12000
augmentation:
  rotation_degrees: 30
  crop_scale:
  - 0.6
  - 1.0
  colour_jitter:
    brightness: 0.25
    contrast: 0.25
    saturation: 0.25
    hue: 0.02
  blur_p: 0.2
  jpeg_p: 0.3
  jpeg_quality:
  - 60
  - 95
optim:
  optimiser: AdamW
  lr_head: 0.001
  lr_backbone: 0.0003
  weight_decay: 0.01
  label_smoothing: 0.06
  batch_size: 32
  epochs_max: 15
  patience: 3
  schedule: 1-epoch warm-up, cosine
compute:
  torch_threads: 10
  workers: 8
